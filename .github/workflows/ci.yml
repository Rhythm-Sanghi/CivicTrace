name: CivicTrace CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: civictrace_user
          POSTGRES_PASSWORD: civictrace_secure_password
          POSTGRES_DB: civictrace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt
      - name: Lint with Ruff
        run: |
          cd services/api
          ruff check .
      - name: Verify Migrations Apply Cleanly (SQLite)
        run: |
          cd services/api
          alembic upgrade head
      - name: Run Backend Tests (SQLite)
        run: |
          cd services/api
          python -m pytest -v
      - name: Verify PostgreSQL Migrations and Full Test Suite
        env:
          DATABASE_URL: postgresql://civictrace_user:civictrace_secure_password@localhost:5432/civictrace_test
        run: |
          cd services/api
          alembic upgrade head
          python -m pytest -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clean install dependencies
        run: |
          cd apps/web
          npm ci
      - name: Run Frontend Tests
        run: |
          cd apps/web
          npm run test
      - name: Build Web Bundle
        run: |
          cd apps/web
          npm run build
