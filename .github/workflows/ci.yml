name: CivicTrace CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-sqlite-test:
    name: Backend Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt
      - name: Lint with Ruff
        run: |
          cd services/api
          ruff check .
      - name: Verify Migrations Apply Cleanly (SQLite)
        env:
          TEST_DATABASE_URL: sqlite:///./test_ci_migrations.db
        run: |
          cd services/api
          alembic upgrade head
      - name: Run Backend Tests (SQLite)
        env:
          TEST_DATABASE_URL: sqlite:///./test_ci.db
        run: |
          cd services/api
          python -m pytest app/tests -v

  backend-postgres-test:
    name: Backend Tests (PostgreSQL & PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: civictrace_user
          POSTGRES_PASSWORD: civictrace_secure_password
          POSTGRES_DB: civictrace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt
      - name: Apply Alembic Migrations to PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://civictrace_user:civictrace_secure_password@localhost:5432/civictrace_test
        run: |
          cd services/api
          alembic upgrade head
      - name: Run Full Integration & Security Suite (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql://civictrace_user:civictrace_secure_password@localhost:5432/civictrace_test
        run: |
          cd services/api
          python -m pytest app/tests -v

  frontend-build:
    name: Frontend Lint, Test & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clean install dependencies
        run: |
          cd apps/web
          npm ci
      - name: Lint Frontend (oxlint)
        run: |
          cd apps/web
          npm run lint
      - name: Run Frontend Tests (Vitest)
        run: |
          cd apps/web
          npm run test
      - name: Build Web Bundle (Vite)
        run: |
          cd apps/web
          npm run build

  browser-e2e-test:
    name: Chromium Browser E2E Lifecycle (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-sqlite-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt playwright pytest
          python -m playwright install --with-deps chromium
      - name: Install frontend dependencies
        run: |
          cd apps/web
          npm ci
      - name: Run Playwright Chromium E2E Lifecycle Verification
        run: |
          python scripts/run_browser_e2e.py
