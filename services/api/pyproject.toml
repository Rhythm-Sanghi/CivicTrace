[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "civictrace"
version = "1.0.0"
description = "A public record of problems worth fixing. An evidence-oriented civic accountability system."
readme = "../../README.md"
authors = [{ name = "CivicTrace Contributors" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "sqlalchemy>=2.0.30,<2.1.0",
    "alembic>=1.13.0,<2.0.0",
    "pydantic>=2.8.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "bcrypt>=4.2.0,<5.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "pyjwt>=2.9.0,<3.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "shapely>=2.0.0,<3.0.0",
    "geoalchemy2>=0.15.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<10.0.0",
    "httpx>=0.27.0,<1.0.0",
    "ruff>=0.5.0,<1.0.0",
    "playwright>=1.45.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["migrations", ".venv", "storage"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E711", "E712", "F403", "E741"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
